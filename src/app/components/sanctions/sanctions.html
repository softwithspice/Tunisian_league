<div class="form-page">

  <button class="back-button" type="button" (click)="retour()">
    ← Retour
  </button>

  <div class="form-card">
    <h2>Ajouter une sanction</h2>
    <p>Une sanction vise soit un joueur, soit un club.</p>

    <form (ngSubmit)="enregistrerSanction()">

      <label>Sanction contre</label>
      <div class="radios">
        <label class="check">
          <input type="radio" name="cible" value="JOUEUR" [(ngModel)]="sanction.cible"
                 (change)="sanction.cibleId = null" />
          Un joueur
        </label>
        <label class="check">
          <input type="radio" name="cible" value="CLUB" [(ngModel)]="sanction.cible"
                 (change)="sanction.cibleId = null" />
          Un club
        </label>
      </div>

      

 <label for="cibleId">{{ sanction.cible === 'JOUEUR' ? 'Joueur' : 'Club' }}</label>
<select id="cibleId" name="cibleId" [(ngModel)]="sanction.cibleId">
  <option [ngValue]="null">— Choisir —</option>

  @if (sanction.cible === 'JOUEUR') {
    @for (j of joueurs; track j.id) {
      <option [ngValue]="j.id">{{ j.prenom }} {{ j.nom }}</option>
    }
  } @else {
    @for (c of clubs; track c.id) {
      <option [ngValue]="c.id">{{ c.nom }} — {{ c.ville }}</option>
    }
  }
</select>
      <div class="row">
        <div class="col">
          <label for="type">Type de sanction</label>
          <select id="type" name="type" [(ngModel)]="sanction.type">
            @for (t of types; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </div>
        <div class="col">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" [(ngModel)]="sanction.date" required />
        </div>
      </div>

      <label for="motif">Motif</label>
      <textarea id="motif" name="motif" rows="3" [(ngModel)]="sanction.motif"
                placeholder="Ex : Cumul de trois cartons jaunes" required></textarea>

      <label for="duree">Durée <span class="facultatif">(nombre de journées, 0 si non applicable)</span></label>
      <input id="duree" name="duree" type="number" min="0" [(ngModel)]="sanction.duree" />

      @if (message) {
        <p class="message">{{ message }}</p>
      }

      <div class="actions">
        <button class="cancel" type="button" (click)="retour()">Annuler</button>
        <button class="submit" type="submit">Enregistrer la sanction</button>
      </div>

    </form>
  </div>

</div>
