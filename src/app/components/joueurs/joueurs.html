<div class="form-page">

  <button class="back-button" type="button" (click)="retour()">
    ← Retour
  </button>

  <div class="form-card">
    <h2>Ajouter un joueur</h2>
    <p>Renseignez les informations du nouveau joueur.</p>

    <form (ngSubmit)="enregistrerJoueur()">

      <div class="row">
        <div class="col">
          <label for="prenom">Prénom</label>
          <input id="prenom" name="prenom" type="text" [(ngModel)]="joueur.prenom"
                 placeholder="Ex : Ahmed" required />
        </div>
        <div class="col">
          <label for="nom">Nom</label>
          <input id="nom" name="nom" type="text" [(ngModel)]="joueur.nom"
                 placeholder="Ex : Ben Salah" required />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="dateNaissance">Date de naissance</label>
          <input id="dateNaissance" name="dateNaissance" type="date"
                 [(ngModel)]="joueur.dateNaissance" required />
        </div>
        <div class="col">
          <label for="poste">Poste</label>
          <select id="poste" name="poste" [(ngModel)]="joueur.poste">
            @for (p of postes; track p) {
              <option [value]="p">{{ p }}</option>
            }
          </select>
        </div>
      </div>

      <label for="nationalite">Nationalité</label>
      <input id="nationalite" name="nationalite" type="text"
             [(ngModel)]="joueur.nationalite" placeholder="Ex : Tunisienne" required />

      @if (message) {
        <p class="message">{{ message }}</p>
      }

      <div class="actions">
        <button class="cancel" type="button" (click)="retour()">Annuler</button>
        <button class="submit" type="submit">Enregistrer le joueur</button>
      </div>

    </form>
  </div>

  <!-- Liste des joueurs : plus tard (quand le GET existera)
  <div class="list-card">
    <h3>Joueurs existants ({{ joueurs.length }})</h3>
    ...
  </div>
  -->

</div>
