<div class="form-page">

  <button class="back-button" type="button" (click)="retour()">
    ← Retour
  </button>

  <div class="form-card">
    <h2>Ajouter un compte</h2>
    <p>Créez le compte du responsable, affectez-lui son club et donnez-lui un mot de passe provisoire.</p>

    <form (ngSubmit)="enregistrerResponsable()">

      <div class="row">
        <div class="col">
          <label for="prenom">Prénom</label>
          <input id="prenom" name="prenom" type="text" [(ngModel)]="responsable.prenom"
                 placeholder="Ex : Mehdi" required />
        </div>
        <div class="col">
          <label for="nom">Nom</label>
          <input id="nom" name="nom" type="text" [(ngModel)]="responsable.nom"
                 placeholder="Ex : Gharbi" required />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" [(ngModel)]="responsable.email"
                 placeholder="Ex : responsable@club.tn" required />
        </div>
        <div class="col">
          <label for="telephone">Téléphone</label>
          <input id="telephone" name="telephone" type="text" [(ngModel)]="responsable.telephone"
                 placeholder="Ex : 20123456" required />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="clubId">Club affecté</label>
          <select id="clubId" name="clubId" [(ngModel)]="responsable.clubId">
            <option [ngValue]="null">— Choisir un club —</option>
            @for (c of clubs; track c.id) {
              <option [ngValue]="c.id">{{ c.nom }} — {{ c.ville }}</option>
            }
          </select>
        </div>
    <div class="actions">
        <button class="cancel" type="button" (click)="retour()">Annuler</button>
        <button class="submit" type="submit">Créer le compte</button>
      </div>
      </div>

      @if (message) {
        <p class="message">{{ message }}</p>
      }

    

    </form>
  </div>

</div>
