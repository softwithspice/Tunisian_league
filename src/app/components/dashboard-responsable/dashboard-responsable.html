<div class="dashboard">

  <aside class="sidebar">
    <h2>⚽ TunisianLeague</h2>
    <p class="subtitle">{{nomClub()}}</p>

    <nav>
      <a routerLink="/responsable" routerLinkActive="active">
        🏠 Accueil
      </a>



      <a routerLink="/responsable/recrutement" routerLinkActive="active">
        👥 Demander un recrutement
      </a>


      <a routerLink="/responsable/mon-effectif" routerLinkActive="active">
        ⚽ Mon effectif
      </a>


      <a routerLink="/responsable/sanctions" routerLinkActive="active">
        ⚖️ Mes sanctions
      </a>

    </nav>

    <button class="logout" (click)="deconnexion()">
      ↪ Se déconnecter
    </button>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <div>
        <h1>Responsable du Club</h1>
        <p>Gestion du football tunisien</p>
      </div>
      <span class="admin-badge">{{nomClub()}}</span>
    </header>



    <section class="page-content">
      <router-outlet></router-outlet>
    </section>

  </main>
</div>
